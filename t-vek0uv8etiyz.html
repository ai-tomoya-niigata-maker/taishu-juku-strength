<body>
<div class=&quot;wrap&quot;>
<div class=&quot;frame&quot;>
  <div class=&quot;side&quot;>
    <span class=&quot;eyebrow&quot;>FULL CLEAN ｜ OPTI-BAR</span><span class=&quot;rel&quot;>放出系の種目</span>
    <h1>オプティバーのフルクリーン｜足で引いて、バーの下へ潜ります</h1>
    <div class=&quot;row&quot; id=&quot;forms&quot; role=&quot;group&quot; aria-label=&quot;フォームの選択&quot;></div>
  </div>
  <div class=&quot;stagebox&quot;>

    <div class=&quot;cams&quot; id=&quot;cams&quot;><span>カメラ</span>
      <button data-c=&quot;obl&quot; aria-pressed=&quot;false&quot;>斜め前</button>

    </div>

  </div>
  <div class=&quot;slider&quot;><button class=&quot;autob&quot; id=&quot;pause&quot; aria-pressed=&quot;true&quot;>自動</button><button class=&quot;autob&quot; id=&quot;slow&quot; aria-pressed=&quot;false&quot;>スロー</button><span>動き</span><input type=&quot;range&quot; id=&quot;seek&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;0&quot; aria-label=&quot;動きの位置&quot;><span id=&quot;seekl&quot;>立位</span></div>
  <div class=&quot;phasegrid&quot;>
    <div class=&quot;phcard p1&quot; id=&quot;ph1&quot;><span class=&quot;pn&quot;>1</span><div><div class=&quot;pt1&quot;>ファーストプル　床〜膝</div><div class=&quot;pt2&quot;>腕は伸ばしたまま、足で床を押します。背中の角度を保ち、バーを膝の高さまで上げます。</div></div></div>
    <div class=&quot;phcard p2&quot; id=&quot;ph2&quot;><span class=&quot;pn&quot;>2</span><div><div class=&quot;pt1&quot;>セカンドプル　伸び上がり</div><div class=&quot;pt2&quot;>お尻を前へ押し出し、股関節・膝・足首を一気に伸ばします（トリプルエクステンション）。足首が伸展して、かかとが上がり、つま先立ちになります。</div></div></div>
    <div class=&quot;phcard p3&quot; id=&quot;ph3&quot;><span class=&quot;pn&quot;>3</span><div><div class=&quot;pt1&quot;>プルアンダー＆キャッチ</div><div class=&quot;pt2&quot;>股関節が伸び切ってから、肘を下へ潜らせ、バーの下へ入ります。キャッチの瞬間は、肘を脇の近くに収め、ハンドルが回転して、スクワットの深さで受け止めます。</div></div></div>

<script>
(function(){
var FORMS={
 ok:{name:'正しいフォーム',col:'#f6c90e',cam:'side',head:'放出系の種目です。オプティバー（Perform Better）を床の固定点につないで、足で床を押してバーを加速し、伸び上がりの最後に手元から放すように送り出して、スクワットの深さで受け止めます。',
   pts:['後ろが開いた枠の中に立つ。バーは床の固定点を中心に、弧を描いて上がる（ハンドルは回転）','ファーストプルは腕を伸ばしたまま、足で床を押す。背中の角度を保つ','セカンドプルでお尻を前へ押し出し、股関節・膝・足首を一気に伸ばす（トリプルエクステンション）','スクワットの深さで受け止め、キャッチの瞬間は肘を脇の近くに収める']},
 arm:{name:'NG：腕で早く引く',col:'#f87171',cam:'side',head:'伸び上がる前に肘が曲がり、腕で引く形になります。足と股関節の力がバーに伝わりません。',
   pts:['腕で早く引くと、足と股関節の力が使えない','バーが体の前へ離れやすい','対策：伸び上がるまで、腕はロープのように伸ばしたままにする','対策：伸び上がり切ってから、肘を動かして体を下へ潜らせる']},
 far:{name:'NG：バーが体から離れる',col:'#f87171',cam:'side',head:'バーが体から離れ、前へ流れます。キャッチで前へ倒されやすくなります。',
   pts:['バーが体から離れると、キャッチで前へ倒される','腕が伸びきり、肩に負担がかかる','対策：バーを体に近い軌道で引く','対策：セカンドプルでお尻を前へ押し出し、バーを体へ近づける']},
 shallow:{name:'NG：キャッチが浅い',col:'#f87171',cam:'side',head:'キャッチが浅く、高い位置で受けます。これはパワークリーンの形で、フルクリーンではありません。',
   pts:['浅いキャッチは、パワークリーン。フルクリーンではない','重量が増えると、受け止められなくなる','対策：バーの下へ深く潜る。足首と股関節の可動域を確保する','対策：伸び上がり切る前に潜り始めない']}
};
var FORDER=['ok','arm','far','shallow'];
var CAMS={obl:{yaw:-.62,pitch:.28},front:{yaw:0,pitch:.04},side:{yaw:-Math.PI/2,pitch:.04},oblb:{yaw:Math.PI+.62,pitch:.28},back:{yaw:Math.PI,pitch:.04},top:{yaw:-Math.PI/2,pitch:1.5},low:{yaw:-.5,pitch:-.32}};
var form='ok', playing=true, t=0, last=0, manual=null;
var yaw=CAMS.side.yaw,pitch=CAMS.side.pitch,tyaw=yaw,tpitch=pitch,camLock=false,dragging=false,lx=0,ly=0;
var cv=document.getElementById('cv'),g=cv.getContext('2d'),W=0,H=0,dpr=1;

function setCam(n,user){tyaw=CAMS[n].yaw;tpitch=CAMS[n].pitch;
  document.querySelectorAll('#cams button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===n?'true':'false')});if(user)camLock=true}
function renderForms(){
  var el=document.getElementById('forms');el.innerHTML='';
  FORDER.forEach(function(k){var f=FORMS[k],b=document.createElement('button');b.className='chip';b.textContent=f.name;
    b.style.setProperty('--pc',f.col);b.setAttribute('aria-pressed',k===form?'true':'false');
    b.onclick=function(){form=k;camLock=false;renderForms();renderCard();setCam(f.cam,false)};el.appendChild(b)});
}
function renderCard(){var f=FORMS[form],c=document.getElementById('card');c.style.setProperty('--pc',f.col);
  c.innerHTML='<div class=&quot;chead&quot;><span class=&quot;en&quot;>'+(form==='ok'?'CHECK POINTS':'COMMON MISTAKE')+'</span><h2>'+f.name+'</h2><p>'+f.head+'</p></div><div class=&quot;ptgrid&quot;>'+f.pts.map(function(x,i){return '<div class=&quot;pt&quot;><span class=&quot;n&quot;>'+(i+1)+'</span><span class=&quot;tx&quot;>'+x+'</span></div>'}).join('')+'</div>'}
document.querySelectorAll('#cams button').forEach(function(b){b.onclick=function(){setCam(b.dataset.c,true)}});
var pauseB=document.getElementById('pause'),slowB=document.getElementById('slow'),slow=false;
function syncAuto(){pauseB.setAttribute('aria-pressed',playing?'true':'false')}
pauseB.onclick=function(){playing=!playing;if(playing)manual=null;syncAuto()};
slowB.onclick=function(){slow=!slow;slowB.setAttribute('aria-pressed',slow?'true':'false')};
var seek=document.getElementById('seek');
seek.oninput=function(){playing=false;syncAuto();manual=seek.value/100};
function fit(){var r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
cv.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;camLock=true;document.querySelectorAll('#cams button').forEach(function(b){b.setAttribute('aria-pressed','false')});cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!dragging)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(1.55,pitch+(e.clientY-ly)*.006));tyaw=yaw;tpitch=pitch;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',function(){dragging=false});cv.addEventListener('pointercancel',function(){dragging=false});

function rx(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]}
function ry(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
var S0,CX,CY,D=5;
function proj(p){var q=ry(p,yaw);q=rx(q,-pitch);var k=D/(D-q[2]);return [CX+q[0]*S0*k,CY-q[1]*S0*k,q[2],k]}

// u: 0=立位 1=ボトム
var AX=.17,TA=8*Math.PI/180,MIDFOOT=.06,HZ=.06;
var LA=.80,TL1=.50,TL2=.26;
var RB=3.0,YP=-.99;                 // 床の固定点（ランドマイン）の高さと、バーの回転半径
var KP=[0,.28,.50,.78,1.0,1.3,1.6];   // スタート／ファースト／セカンド(伸び切り)／キャッチ／スタンド／腰の脇へ／床へ戻す
var PMAX=1.6;
function hs(v,p){
  var n=KP.length,i=0;while(i<n-2&amp;&amp;p>KP[i+1])i++;
  var t0=KP[i],t1=KP[i+1],h=t1-t0,u=(p-t0)/h,u2=u*u,u3=u2*u;
  function m(k){var a=Math.max(0,k-1),b=Math.min(n-1,k+1);return (v[b]-v[a])/(KP[b]-KP[a])}
  var m0=m(i)*h,m1=m(i+1)*h;
  return (2*u3-3*u2+1)*v[i]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*v[i+1]+(u3-u2)*m1;
}
function ik3(h,a,l1,l2,pole){var dv=sub(a,h),dl=Math.min(len(dv),l1+l2-.002),dn=nor(dv),aa=(l1*l1-l2*l2+dl*dl)/(2*dl),hh=Math.sqrt(Math.max(0,l1*l1-aa*aa)),pn=nor(sub(pole,mul(dn,dot(pole,dn))));return add(add(h,mul(dn,aa)),mul(pn,hh))}
function pose(f,u){
  var p=u*PMAX,rad=Math.PI/180,ankY=-1.04;
  var YH=f==='shallow'?[-.78,-.50,.10,.30,.68,-.02,-.78]:[-.78,-.50,.10,.08,.68,-.02,-.78];

  g.fillStyle='#f6c90e';g.fillText('バーの高さ　床から '+hcm+'cm',W*.04,H*.09+fs*6);

  var pfa=Math.round(Math.asin(Math.min(1,J.lift/.35))*180/Math.PI);
  g.fillStyle=pfa>4?'#86efac':'#e2e8f0';g.fillText('足首　'+(pfa>4?'伸展（つま先立ち）'+pfa+'°':'床について曲がっている'),W*.04,H*.09+fs*9);
  g.fillStyle=far?'#f87171':'#f6c90e';g.fillText('バーと体の距離　'+(far?'離れる ＋'+Math.round(J.far*82)+'cm':'近い'),W*.04,H*.09+fs*10.5);

  g.font='700 '+Math.max(10,W*.015)+'px &quot;Noto Sans JP&quot;,sans-serif';g.fillStyle='rgba(248,250,252,.75)';
  var mp=proj([0,1.25,MIDFOOT]);g.textAlign='center';g.fillText('足の中心',mp[0],mp[1]-8);
  var bl=proj([0,YP+(RB-2.1)*Math.sin(J.theta),J.ZPe-(RB-2.1)*Math.cos(J.theta)]);
  g.textAlign='left';g.fillStyle='#cbd5e1';g.fillText('→ 床の固定点（ランドマイン）へ',bl[0]+6,bl[1]-6);
  requestAnimationFrame(frame);
}
