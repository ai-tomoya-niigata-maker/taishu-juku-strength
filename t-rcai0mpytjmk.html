<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>デッドリフト｜3D解説</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#05070d;--bg-1:#0a0e1a;--bg-3:#13253a;--bg-4:#1a3049;--line:#1e3555;--gold:#f6c90e;--ng:#f87171;--fg:#f8fafc;--fg-body:#e2e8f0;--fg-sub:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-0);font-family:'Noto Sans JP',sans-serif;color:var(--fg-body);-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:radial-gradient(120% 120% at 50% 0%,#0a1220 0%,#05070d 70%)}
.frame{container-type:inline-size;width:min(96vw,1240px);background:var(--bg-1);border-radius:14px;overflow:hidden;display:block;position:relative;padding:2.6cqw 2.6cqw 2.8cqw}
.side{display:block}
.eyebrow{font-size:1cqw;letter-spacing:.3em;color:var(--gold);font-weight:700}
h1{font-size:2.5cqw;font-weight:900;color:var(--fg);line-height:1.25;margin-top:.4em}
.row{display:flex;gap:.45cqw;margin-top:1cqw;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;font-size:1.2cqw;color:var(--fg-body);background:transparent;border:.12cqw solid var(--line);border-radius:999px;padding:.4cqw .9cqw;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pc,var(--gold));border-color:var(--pc,var(--gold));color:#0a0e1a}
.card{margin-top:1.4cqw;position:relative}
.chead{background:var(--bg-3);border-radius:1cqw;padding:1.8cqw 2.2cqw 1.9cqw;position:relative;overflow:hidden}
.chead::before{content:"";position:absolute;left:0;top:0;right:0;height:.4cqw;background:var(--pc,var(--gold))}
.card .en{font-size:1.1cqw;letter-spacing:.2em;font-weight:900;color:var(--pc,var(--gold))}
.card h2{font-size:2.7cqw;font-weight:900;color:var(--fg);margin:.1em 0 .3em;line-height:1.3}
.card p{font-size:1.9cqw;line-height:1.7;color:var(--fg)}
.ptgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;margin-top:1.2cqw}
.pt{background:var(--bg-3);border-radius:1cqw;padding:1.6cqw 1.8cqw 1.7cqw 2.6cqw;position:relative;overflow:hidden;min-height:7.5cqw;display:flex;align-items:center}
.pt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.7cqw;background:var(--pc,var(--gold))}
.pt .n{flex:none;font-size:2.6cqw;font-weight:900;color:var(--pc,var(--gold));margin-right:1.2cqw;font-variant-numeric:tabular-nums}
.pt .tx{font-size:1.75cqw;line-height:1.6;font-weight:500;color:var(--fg)}
.slider{margin-top:1cqw;display:flex;align-items:center;gap:.8cqw;font-size:1.2cqw;color:var(--fg-sub);font-weight:700}
.slider input{flex:1;accent-color:var(--gold)}
.autob{font:inherit;font-size:1.3cqw;font-weight:900;color:var(--fg);background:var(--bg-4);border:0;border-radius:999px;padding:.6cqw 1.8cqw;cursor:pointer}
.autob[aria-pressed="true"]{background:var(--gold);color:#0a0e1a}
.stagebox{position:relative;min-width:0;height:clamp(440px,56cqw,760px);margin-top:1.4cqw;background:var(--bg-3);border-radius:1cqw;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.cams{position:absolute;right:1.6cqw;top:1.4cqw;display:flex;gap:.4cqw;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.cams span{font-size:1.1cqw;color:var(--fg-sub);margin-right:.4cqw;font-weight:700}
.cams button,.ctrl button{font:inherit;font-size:1.2cqw;font-weight:700;color:var(--fg);background:var(--bg-4);border:0;border-radius:999px;padding:.55cqw 1.2cqw;cursor:pointer}
.cams button[aria-pressed="true"]{background:var(--fg);color:#0a0e1a}
.hint{position:absolute;left:1.6cqw;bottom:1.4cqw;font-size:1.1cqw;color:var(--fg-sub)}
.ctrl{position:absolute;right:2.4cqw;bottom:2cqw;display:flex;gap:.4cqw}
@media (max-width:700px){
  .frame{width:96vw;padding:16px}.stagebox{height:104vw}
  .eyebrow{font-size:10px}h1{font-size:22px}.chip{font-size:12px;padding:6px 11px}
  .chead{padding:16px}.card .en{font-size:10px}.card h2{font-size:22px}.card p{font-size:15px}.ptgrid{grid-template-columns:1fr;gap:10px}.pt{padding:14px 14px 14px 20px;min-height:0}.pt .n{font-size:22px}.pt .tx{font-size:15px}.slider{font-size:12px}
  .cams button,.ctrl button{font-size:11px;padding:6px 12px}.cams span,.hint{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="frame">
  <div class="side">
    <span class="eyebrow">DEADLIFT</span>
    <h1>バーは足の真上、背骨はまっすぐです</h1>
    <div class="row" id="forms" role="group" aria-label="フォームの選択"></div>
  </div>
  <div class="stagebox">
    <canvas id="cv" aria-label="デッドリフトの3D図"></canvas>
    <div class="cams" id="cams"><span>カメラ</span>
      <button data-c="obl" aria-pressed="false">斜め前</button>
      <button data-c="side" aria-pressed="true">横</button>
      <button data-c="front" aria-pressed="false">正面</button>
      <button data-c="oblb" aria-pressed="false">斜め後ろ</button>
      <button data-c="back" aria-pressed="false">後ろ</button>
      <button data-c="top" aria-pressed="false">真上</button>
      <button data-c="low" aria-pressed="false">ローアングル</button>
    </div>
    <div class="hint">ドラッグで自由に回せます　／　黄の壁＝矢状面　青の壁＝前額面</div>
  </div>
  <div class="slider"><button class="autob" id="pause" aria-pressed="true">自動</button><button class="autob" id="slow" aria-pressed="false">スロー</button><span>動き</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="動きの位置"><span id="seekl">立位</span></div>
  <div class="card" id="card"></div>
</div>
</div>
<script>
(function(){
var FORMS={
 ok:{name:'正しいフォーム',col:'#f6c90e',cam:'side',head:'バーは足の中心の真上を垂直に動きます。背骨はまっすぐなまま、膝とお尻を同時に伸ばして立ちます。',
   pts:['バーは足の中心の真上で、すねに触れながら垂直に動く','背骨はまっすぐ（丸めない・反らさない）。頭は背骨の延長','肩はバーの真上かやや前。腕はまっすぐ伸ばしたまま','膝と股関節を同時に伸ばす。足裏で床を押し、お尻と太もも裏で立つ']},
 round:{name:'NG：背中が丸まる',col:'#f87171',cam:'side',head:'背骨が丸まり、腰に負担が集中します。肩が前へ出て、バーが体から離れます。',
   pts:['腰が丸まると、腰の椎間板に負担がかかる','肩が前へ落ち、バーとの距離が広がる','対策：胸を張り、肋骨を下げて背骨を一本の柱にする','対策：バーを引く前に脇を締め、体の緊張を作る']},
 hips:{name:'NG：お尻が先に上がる',col:'#f87171',cam:'side',head:'膝が先に伸び、お尻だけが上がります。背中が水平に近づき、腰で引く形になります。',
   pts:['お尻が先に上がると、腰で引く形になる','太もも裏が伸びきり、床を押す力が使えない','対策：足で床を押し続け、膝とお尻を同時に伸ばす','対策：スタートで胸を立て、肩とお尻の高さの関係を保つ']},
 bar:{name:'NG：バーが体から離れる',col:'#f87171',cam:'side',head:'バーが足の中心より前へ離れ、軌道が前へ流れます。腰に大きなてこの力がかかります。',
   pts:['バーが体から離れるほど、腰へのてこが長くなる','肩が前に出て、背中が丸まりやすい','対策：バーをすねにこすらせるように引く','対策：脇を締め、背中の筋肉でバーを体へ引き寄せる']}
};
var FORDER=['ok','round','hips','bar'];
var CAMS={obl:{yaw:-.62,pitch:.28},front:{yaw:0,pitch:.04},side:{yaw:-Math.PI/2,pitch:.04},oblb:{yaw:Math.PI+.62,pitch:.28},back:{yaw:Math.PI,pitch:.04},top:{yaw:-Math.PI/2,pitch:1.5},low:{yaw:-.5,pitch:-.32}};
var form='ok', playing=true, t=0, last=0, manual=null;
var yaw=CAMS.side.yaw,pitch=CAMS.side.pitch,tyaw=yaw,tpitch=pitch,camLock=false,dragging=false,lx=0,ly=0;
var cv=document.getElementById('cv'),g=cv.getContext('2d'),W=0,H=0,dpr=1;

function setCam(n,user){tyaw=CAMS[n].yaw;tpitch=CAMS[n].pitch;
  document.querySelectorAll('#cams button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.c===n?'true':'false')});if(user)camLock=true}
function renderForms(){
  var el=document.getElementById('forms');el.innerHTML='';
  FORDER.forEach(function(k){var f=FORMS[k],b=document.createElement('button');b.className='chip';b.textContent=f.name;
    b.style.setProperty('--pc',f.col);b.setAttribute('aria-pressed',k===form?'true':'false');
    b.onclick=function(){form=k;camLock=false;renderForms();renderCard();setCam(f.cam,false)};el.appendChild(b)});
}
function renderCard(){var f=FORMS[form],c=document.getElementById('card');c.style.setProperty('--pc',f.col);
  c.innerHTML='<div class="chead"><span class="en">'+(form==='ok'?'CHECK POINTS':'COMMON MISTAKE')+'</span><h2>'+f.name+'</h2><p>'+f.head+'</p></div><div class="ptgrid">'+f.pts.map(function(x,i){return '<div class="pt"><span class="n">'+(i+1)+'</span><span class="tx">'+x+'</span></div>'}).join('')+'</div>'}
document.querySelectorAll('#cams button').forEach(function(b){b.onclick=function(){setCam(b.dataset.c,true)}});
var pauseB=document.getElementById('pause'),slowB=document.getElementById('slow'),slow=false;
function syncAuto(){pauseB.setAttribute('aria-pressed',playing?'true':'false')}
pauseB.onclick=function(){playing=!playing;if(playing)manual=null;syncAuto()};
slowB.onclick=function(){slow=!slow;slowB.setAttribute('aria-pressed',slow?'true':'false')};
var seek=document.getElementById('seek');
seek.oninput=function(){playing=false;syncAuto();manual=seek.value/100};
function fit(){var r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);
cv.addEventListener('pointerdown',function(e){dragging=true;lx=e.clientX;ly=e.clientY;camLock=true;document.querySelectorAll('#cams button').forEach(function(b){b.setAttribute('aria-pressed','false')});cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!dragging)return;yaw+=(e.clientX-lx)*.008;pitch=Math.max(-.6,Math.min(1.55,pitch+(e.clientY-ly)*.006));tyaw=yaw;tpitch=pitch;lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',function(){dragging=false});cv.addEventListener('pointercancel',function(){dragging=false});

function rx(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]}
function ry(p,a){var c=Math.cos(a),s=Math.sin(a);return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
var S0,CX,CY,D=5;
function proj(p){var q=ry(p,yaw);q=rx(q,-pitch);var k=D/(D-q[2]);return [CX+q[0]*S0*k,CY-q[1]*S0*k,q[2],k]}

// u: 0=立位 1=ボトム
var AX=.15,TA=8*Math.PI/180,MIDFOOT=.12;
var LA=.80,TL1=.50,TL2=.26,LB=[58,50,76,58]; // 腕の長さ・骨盤〜胸・胸〜肩・床での前傾
function pose(f,u){
  var ankY=-1.04,rad=Math.PI/180;
  var lamb={ok:58,round:50,hips:76,bar:58}[f]*rad;
  var lam=lamb*u,l1=lam,l2=lam;
  if(f==='round'){l1=lam-20*rad*u;l2=lam+26*rad*u}
  var barz=MIDFOOT+(f==='bar'?.26*u:0);
  var yb=(.76-LA)+((-.92)-(.76-LA))*u;
  var zs=u*(barz+.05);
  var Sz=zs,Sy=yb+Math.sqrt(Math.max(0,LA*LA-(zs-barz)*(zs-barz)));
  var Hz=Sz-TL1*Math.sin(l1)-TL2*Math.sin(l2),Hy=Sy-TL1*Math.cos(l1)-TL2*Math.cos(l2);
  var dx=Hz-0,dy=Hy-ankY,d=Math.sqrt(dx*dx+dy*dy);
  if(d>1.036){Hz=dx*1.036/d;Hy=ankY+dy*1.036/d;d=1.036;dx=Hz;dy=Hy-ankY}
  var ux=dx/d,uy=dy/d,mh=Math.sqrt(Math.max(0,.52*.52-(d/2)*(d/2)));
  var Kz=Hz/2+mh*uy,Ky=(ankY+Hy)/2-mh*ux;
  var pel=[0,Hy,Hz],J={pelvis:pel};
  J.hipL=add(pel,[-.14,0,0]);J.hipR=add(pel,[.14,0,0]);
  J.ankL=[-AX,ankY,0];J.ankR=[AX,ankY,0];
  var kx=AX+.02*u;
  J.kneeL=[-kx,Ky,Kz];J.kneeR=[kx,Ky,Kz];
  J.footL=add(J.ankL,[-Math.sin(TA)*.28,-.02,Math.cos(TA)*.28]);J.footR=add(J.ankR,[Math.sin(TA)*.28,-.02,Math.cos(TA)*.28]);
  var chest=add(pel,[0,TL1*Math.cos(l1),TL1*Math.sin(l1)]);
  var shm=add(chest,[0,TL2*Math.cos(l2),TL2*Math.sin(l2)]);
  var l3=l2-28*rad*u,neck=add(chest,[0,.34*Math.cos(l2),.34*Math.sin(l2)]);
  J.chest=chest;J.neck=neck;J.head=add(neck,[0,.22*Math.cos(l3),.22*Math.sin(l3)]);
  J.shL=add(shm,[-.27,0,0]);J.shR=add(shm,[.27,0,0]);
  J.haL=[-.30,yb,barz];J.haR=[.30,yb,barz];
  J.elL=mulAdd(J.shL,J.haL);J.elR=mulAdd(J.shR,J.haR);
  J.bar=[0,yb,barz];
  J.lam=lam;J.spine=(l2-l1);J.hipGap=Hy-Ky;
  return J;
}
function mulAdd(a,b){return[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]}
function barTrail(f){var r=[];for(var i=0;i<=30;i++){r.push(pose(f,i/30).bar)}return r}

function drawPlane(){
  var a=1.15,q=[[0,-1.2,-a],[0,-1.2,a],[0,1.25,a],[0,1.25,-a]].map(proj);
  g.beginPath();g.moveTo(q[0][0],q[0][1]);for(var i=1;i<4;i++)g.lineTo(q[i][0],q[i][1]);g.closePath();
  g.fillStyle='rgba(246,201,14,.08)';g.fill();g.lineWidth=2;g.strokeStyle='rgba(246,201,14,.55)';g.stroke();
}
function drawPlane2(){
  var a=1.15,z=MIDFOOT,q=[[-a,-1.2,z],[a,-1.2,z],[a,1.25,z],[-a,1.25,z]].map(proj);
  g.beginPath();g.moveTo(q[0][0],q[0][1]);for(var i=1;i<4;i++)g.lineTo(q[i][0],q[i][1]);g.closePath();
  g.fillStyle='rgba(125,211,252,.08)';g.fill();g.lineWidth=2;g.strokeStyle='rgba(125,211,252,.6)';g.stroke();
}
function ang2(c,p){return Math.atan2(p[2]-c[2],p[1]-c[1])}
function wedge(c,pa,pb,col,label){
  var a1=ang2(c,pa),a2=ang2(c,pb),d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  var r=.27,pts=[proj(c)];for(var i=0;i<=18;i++){var a=a1+d*i/18;pts.push(proj([c[0],c[1]+r*Math.cos(a),c[2]+r*Math.sin(a)]))}
  g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.closePath();
  g.fillStyle=col==='#f6c90e'?'rgba(246,201,14,.38)':'rgba(248,113,113,.38)';g.fill();g.lineWidth=3;g.strokeStyle=col;g.stroke();
  var am=a1+d/2,lp=proj([c[0],c[1]+(r+.2)*Math.cos(am),c[2]+(r+.2)*Math.sin(am)]);
  g.font='900 '+Math.max(11,W*.017)+'px "Noto Sans JP",sans-serif';g.fillStyle=col;g.textAlign='center';g.fillText(label,lp[0],lp[1]);
  return Math.round(180-Math.abs(d)*180/Math.PI);
}
function line(a,b,w,col){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.stroke()}
function disc(c,r,col){var pts=[];for(var i=0;i<28;i++){var a=i/28*Math.PI*2;pts.push(proj([c[0],c[1]+r*Math.cos(a),c[2]+r*Math.sin(a)]))}
  g.beginPath();pts.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.closePath();g.fillStyle='#0a0e1a';g.fill();g.lineWidth=3;g.strokeStyle=col;g.stroke()}


function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function mul(a,k){return[a[0]*k,a[1]*k,a[2]*k]}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function crs(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function len(a){return Math.sqrt(dot(a,a))}
function nor(a){var l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]}
function lerp(a,b,m){return a+(b-a)*m}
var items=[],S=1;
// ---------- 描画部品 ----------
  var items=[];
  function seg3(a,b,w,col,zb){var pa=proj(a),pb=proj(b);items.push({z:(pa[2]+pb[2])/2+(zb||0),d:function(){
    g.strokeStyle=col;g.lineWidth=w*S*(pa[3]+pb[3])/2;g.lineCap='round';g.beginPath();g.moveTo(pa[0],pa[1]);g.lineTo(pb[0],pb[1]);g.stroke()}})}
  function poly(pts,fill,stroke,alphaFn,zb){var q=pts.map(proj),z=0;q.forEach(function(p){z+=p[2]});z/=q.length;items.push({z:z+(zb||0),d:function(){
    g.globalAlpha=alphaFn?alphaFn():1;g.beginPath();g.moveTo(q[0][0],q[0][1]);for(var i=1;i<q.length;i++)g.lineTo(q[i][0],q[i][1]);g.closePath();
    if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}g.globalAlpha=1}})}
  // ---- 滑らかな立体（メッシュ）：断面のリングをつないで面を張る ----
  var LIGHT=nor([-.35,.75,.55]);
  function meshDraw(rings,centers,shadow,light){
    var R=rings.length,N=rings[0].length,pr=rings.map(function(r){return r.map(proj)});
    for(var i=0;i<R-1;i++){
      var cc=mul(add(centers[i],centers[i+1]),.5);
      for(var j=0;j<N;j++){
        var j2=(j+1)%N,a=pr[i][j],b=pr[i][j2],c=pr[i+1][j2],d=pr[i+1][j];
        var mid=mul(add(add(rings[i][j],rings[i][j2]),add(rings[i+1][j2],rings[i+1][j])),.25);
        var nn=nor(sub(mid,cc)),k=Math.max(0,dot(nn,LIGHT)),kk=.18+.82*Math.pow(k,.8);
        var col='rgb('+Math.round(lerp(shadow[0],light[0],kk))+','+Math.round(lerp(shadow[1],light[1],kk))+','+Math.round(lerp(shadow[2],light[2],kk))+')';
        (function(a,b,c,d,col){items.push({z:(a[2]+b[2]+c[2]+d[2])/4,d:function(){
          g.fillStyle=col;g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();g.fill();g.stroke()}})})(a,b,c,d,col);
      }
    }
  }
