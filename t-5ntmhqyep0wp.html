<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>デッドリフト｜動く図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#05070d;--bg-1:#0a0e1a;--bg-2:#0d1b2a;--bg-3:#13253a;--bg-4:#1a3049;--line:#1e3555;
  --gold:#f6c90e;--fg:#f8fafc;--fg-body:#e2e8f0;--fg-sub:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg-0);font-family:'Noto Sans JP',sans-serif;color:var(--fg-body);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 120% at 50% 0%,#0a1220 0%,#05070d 70%);padding:24px 16px 40px}
.page{max-width:1180px;margin:0 auto}
.eyebrow{display:block;font-size:13px;letter-spacing:.3em;color:var(--gold);font-weight:700}
h1{font-size:clamp(24px,4vw,40px);font-weight:900;color:var(--fg);line-height:1.3;margin-top:8px}
.tags{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--bg-1);background:var(--gold);padding:5px 12px;border-radius:6px}
.tag.o{background:var(--bg-4);color:var(--gold)}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:22px;align-items:start}
.fig{position:relative;background:var(--bg-3);border-radius:16px;overflow:hidden}
.fig::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--gold)}
.fig svg{display:block;width:100%;height:auto}
.phase{position:absolute;left:18px;top:22px;font-size:clamp(16px,2.4vw,24px);font-weight:900;color:var(--gold)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line)}
.ctrl button{font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--bg-4);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.ctrl button:hover{background:var(--line)}
.ctrl button[aria-pressed="true"]{background:var(--gold);color:var(--bg-1)}
.ctrl input[type=range]{flex:1;min-width:140px;accent-color:var(--gold)}
.read{display:flex;gap:28px;padding:0 18px 16px}
.read div{font-size:13px;color:var(--fg-sub)}
.read b{display:block;font-size:26px;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:900}
.side{display:flex;flex-direction:column;gap:14px}
.rowcard{position:relative;background:var(--bg-3);border-radius:14px;padding:16px 20px 16px 26px;overflow:hidden}
.rowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--gold)}
.rowcard h2{font-size:18px;font-weight:900;color:var(--fg);margin-bottom:4px}
.rowcard p{font-size:15px;line-height:1.7;color:var(--fg-body)}
.kgbox{background:var(--bg-3);border-radius:14px;padding:14px 22px 16px}
.kgbox .no{font-size:13px;font-weight:900;color:var(--gold);letter-spacing:.15em}
.kgbox .row{display:flex;gap:40px;margin-top:4px}
.kg{font-size:30px;font-weight:900;color:var(--fg)}
.kg small{display:block;font-size:12px;color:var(--fg-sub);font-weight:500}
.credit{margin-top:26px;text-align:center;font-size:12px;letter-spacing:.1em;color:var(--fg-sub)}
svg text{font-family:'Noto Sans JP',sans-serif}
@media (max-width:820px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <span class="eyebrow">LIFT 01 ｜ DEADLIFT</span>
  <h1>デッドリフトは、肋骨を下げたまま床から引きます</h1>
  <div class="tags"><span class="tag">LOWER PULL</span><span class="tag o">矢状面</span><span class="tag o">両側性</span></div>

  <div class="main">
    <div class="fig">
      <div class="phase" id="phase">構え</div>
      <svg viewBox="0 0 620 640" role="img" aria-label="デッドリフトの動きを横から見た図">
        <!-- 床 -->
        <path d="M20 562H600" stroke="#94a3b8" stroke-width="3"/>
        <!-- バーの通り道（足の中心の真上） -->
        <path id="gline" stroke="#f6c90e" stroke-width="2" stroke-dasharray="6 10" opacity=".55"/>
        <text id="glabel" font-size="17" font-weight="700" fill="#f6c90e" opacity=".9" text-anchor="middle">バーは足の中心の真上</text>
        <!-- 足 -->
        <path id="foot" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
        <!-- 骨格 -->
        <path id="leg" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="torso" fill="none" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="arm" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="head" r="26" fill="#13253a" stroke="#f8fafc" stroke-width="7"/>
        <!-- バーベル -->
        <circle id="plate" r="40" fill="rgba(246,201,14,.12)" stroke="#f6c90e" stroke-width="8"/>
        <circle id="hub" r="8" fill="#f6c90e"/>
        <!-- 関節 -->
        <circle id="jk" r="7" fill="#f6c90e"/>
        <circle id="jh" r="7" fill="#f6c90e"/>
        <!-- 肋骨の印 -->
        <path id="ribs" stroke="#f6c90e" stroke-width="5" stroke-linecap="round"/>
        <text id="ribl" font-size="16" font-weight="700" fill="#f6c90e" text-anchor="end">肋骨は下げたまま</text>
        <text id="spinel" font-size="16" font-weight="700" fill="#7dd3fc" text-anchor="end">背骨は長いまま</text>
        <!-- 動きの矢印 -->
        <g id="arrow" fill="none" stroke="#f6c90e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path id="arrp"/>
        </g>
      </svg>
      <div class="read">
        <div>膝の角度<b id="rk">180°</b></div>
        <div>胴体の傾き<b id="rt">0°</b></div>
        <div>引き上げの進み<b id="rd">0%</b></div>
      </div>
      <div class="ctrl">
        <button id="play" aria-pressed="true">一時停止</button>
        <button id="slow" aria-pressed="false">スロー</button>
        <input id="scrub" type="range" min="0" max="100" value="0" aria-label="引き上げの進み">
      </div>
    </div>

    <div class="side">
      <div class="rowcard"><h2>構え</h2><p>バーは足の中心の真上です。股関節を引き、背中を平らに保ちます。</p></div>
      <div class="rowcard"><h2>動作</h2><p>床を押しながら、股関節を前へ送って立ちます。バーは体に沿わせます。</p></div>
      <div class="rowcard"><h2>チェック</h2><p>肋骨が開かず、背骨が長いままか。腰を反らせて終わっていないか。</p></div>
      <div class="kgbox"><span class="no">10回挙上の目安</span>
        <div class="row"><div class="kg">112.5kg<small>130km/h</small></div><div class="kg">147.5kg<small>140km/h</small></div></div>
      </div>
    </div>
  </div>
  <div class="credit">体修塾BCA ｜ 代表　大林智也</div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var A=[225,545],L1=109,L2=131,TH=161,AL=262,BX=258,T0=54*Math.PI/180,H0=[160,350],H1=[228,305.5];
  var el={leg:$('leg'),torso:$('torso'),arm:$('arm'),head:$('head'),plate:$('plate'),hub:$('hub'),foot:$('foot'),
    jk:$('jk'),jh:$('jh'),ribs:$('ribs'),ribl:$('ribl'),spinel:$('spinel'),gline:$('gline'),glabel:$('glabel'),
    arrp:$('arrp'),arrow:$('arrow'),phase:$('phase'),rk:$('rk'),rt:$('rt'),rd:$('rd'),scrub:$('scrub'),play:$('play'),slow:$('slow')};
  var rad=Math.PI/180;
  function P(x,y){return x.toFixed(1)+' '+y.toFixed(1)}
  function draw(s,lifting){
    // s: 0=構え（床）, 1=立ち切り。股関節の位置と胴体の起き上がりで姿勢を決める
    var H=[H0[0]+(H1[0]-H0[0])*s,H0[1]+(H1[1]-H0[1])*s];
    var dx=H[0]-A[0],dy=H[1]-A[1],d=Math.min(Math.hypot(dx,dy),L1+L2-.5);
    var a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a)),ux=dx/d,uy=dy/d;
    var K=[A[0]+a*ux+h*uy,A[1]+a*uy-h*ux];
    if(K[0]<A[0])K=[A[0]+a*ux-h*uy,A[1]+a*uy+h*ux];
    var th=T0*(1-s),dir=[Math.sin(th),-Math.cos(th)];
    var S=[H[0]+TH*dir[0],H[1]+TH*dir[1]];
    var by=S[1]+Math.sqrt(AL*AL-Math.pow(S[0]-BX,2));
    var hd=[S[0]+46*dir[0],S[1]+46*dir[1]];
    el.leg.setAttribute('d','M'+P(A[0],A[1])+'L'+P(K[0],K[1])+'L'+P(H[0],H[1]));
    el.torso.setAttribute('d','M'+P(H[0],H[1])+'L'+P(S[0],S[1])+'L'+P(S[0]+22*dir[0],S[1]+22*dir[1]));
    el.arm.setAttribute('d','M'+P(S[0],S[1])+'L'+P(BX,by));
    el.head.setAttribute('cx',hd[0]);el.head.setAttribute('cy',hd[1]);
    el.plate.setAttribute('cx',BX);el.plate.setAttribute('cy',by);el.hub.setAttribute('cx',BX);el.hub.setAttribute('cy',by);
    el.jk.setAttribute('cx',K[0]);el.jk.setAttribute('cy',K[1]);el.jh.setAttribute('cx',H[0]);el.jh.setAttribute('cy',H[1]);
    el.foot.setAttribute('d','M'+P(A[0]-35,562)+'L'+P(A[0]+65,562));
    el.gline.setAttribute('d','M'+P(BX,40)+'L'+P(BX,562));
    el.glabel.setAttribute('x',BX);el.glabel.setAttribute('y',594);
    // 肋骨の印：胴体の上寄りに、胴体に直角の短い線
    var rm=[H[0]+(S[0]-H[0])*.72,H[1]+(S[1]-H[1])*.72];
    el.ribs.setAttribute('d','M'+P(rm[0]-16*Math.cos(th),rm[1]-16*Math.sin(th))+'L'+P(rm[0]+16*Math.cos(th),rm[1]+16*Math.sin(th)));
    el.ribl.setAttribute('x',rm[0]-26);el.ribl.setAttribute('y',rm[1]-6);
    var sm=[H[0]+(S[0]-H[0])*.4,H[1]+(S[1]-H[1])*.4];
    el.spinel.setAttribute('x',sm[0]-26);el.spinel.setAttribute('y',sm[1]+8);
    var ay=lifting?'M560 470V330M538 354L560 330L582 354':'M560 330V470M538 446L560 470L582 446';
    el.arrp.setAttribute('d',ay);
    var kn=Math.acos(((A[0]-K[0])*(H[0]-K[0])+(A[1]-K[1])*(H[1]-K[1]))/(L1*L2))/rad;
    el.rk.textContent=Math.round(kn)+'°';
    el.rt.textContent=Math.round(th/rad)+'°';
    el.rd.textContent=Math.round(s*100)+'%';
    el.phase.textContent=s<.03?'構え':(s>.97?'立つ':(lifting?'引く':'下ろす'));
  }
  var playing=true,slow=false,last=0,clock=0;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  var seg=[.6,1.8,.7,1.8];
  function cyc(t){
    var tot=seg[0]+seg[1]+seg[2]+seg[3];t=((t%tot)+tot)%tot;
    if(t<seg[0])return[0,true];
    t-=seg[0];if(t<seg[1])return[ease(t/seg[1]),true];
    t-=seg[1];if(t<seg[2])return[1,false];
    t-=seg[2];return[1-ease(t/seg[3]),false];
  }
  function loop(ts){
    if(!last)last=ts;var dt=(ts-last)/1000;last=ts;
    if(playing){clock+=dt*(slow?.5:1);var r=cyc(clock);draw(r[0],r[1]);el.scrub.value=Math.round(r[0]*100)}
    requestAnimationFrame(loop);
  }
  el.play.onclick=function(){playing=!playing;el.play.textContent=playing?'一時停止':'再生';el.play.setAttribute('aria-pressed',playing?'true':'false')};
  el.slow.onclick=function(){slow=!slow;el.slow.setAttribute('aria-pressed',slow?'true':'false')};
  el.scrub.oninput=function(){
    playing=false;el.play.textContent='再生';el.play.setAttribute('aria-pressed','false');
    draw(el.scrub.value/100,true);
  };
  draw(0,true);
  if(!reduce)requestAnimationFrame(loop);else{playing=false;el.play.textContent='再生';el.play.setAttribute('aria-pressed','false')}
})();
</script>
</body>
</html>
